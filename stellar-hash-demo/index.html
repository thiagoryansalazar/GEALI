<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Registro de Hash Stellar</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding:
          max(20px, env(safe-area-inset-top))
          max(16px, env(safe-area-inset-right))
          max(20px, env(safe-area-inset-bottom))
          max(16px, env(safe-area-inset-left));
        background: #f5f7fb;
        color: #1f2937;
      }

      main {
        width: min(100%, 720px);
        margin: 0 auto;
        padding: clamp(20px, 5vw, 32px);
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(1.8rem, 5vw, 2.4rem);
        line-height: 1.2;
      }

      textarea {
        width: 100%;
        min-height: 220px;
        padding: 14px 16px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font: inherit;
        line-height: 1.5;
        resize: vertical;
      }

      button {
        width: 100%;
        min-height: 48px;
        margin-top: 16px;
        padding: 12px 16px;
        border: 0;
        border-radius: 8px;
        background: #2563eb;
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      pre {
        margin: 20px 0 0;
        padding: 16px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #ffffff;
        font: 14px/1.5 Consolas, Monaco, monospace;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Registro de Hash Stellar</h1>
      <textarea
        id="texto"
        placeholder="Cole ou digite o texto do relatorio aqui"
      ></textarea>
      <button type="button" onclick="registrarHash()">Registrar hash</button>
      <pre id="resultado"></pre>
    </main>

    <script>
      function formatarData(data) {
        const dia = String(data.getDate()).padStart(2, '0');
        const mes = String(data.getMonth() + 1).padStart(2, '0');
        const ano = data.getFullYear();
        return `${dia}/${mes}/${ano}`;
      }

      function montarCertificado(dataVistoria, proximaVistoria) {
        return `CERTIFICADO DE VISTORIA TECNICA

Doceria da Mariana Alves - Goiania/GO

Data da vistoria: ${dataVistoria}
Proxima vistoria: ${proximaVistoria}

Responsavel tecnico: Joao Silva - CRN 12345

Aspectos verificados:
Estrutura fisica e higienizacao
Controle de temperatura de equipamentos
Condicoes de armazenamento de insumos
Rotulagem de produtos finais
Registro de Boas Praticas de Fabricacao (BPF)

Pendencias identificadas:
Adequar area de manipulacao
Implementar planilha de controle diario

Este certificado e uma prova digital da realizacao da vistoria na data indicada.`;
      }

      document.addEventListener('DOMContentLoaded', () => {
        const hoje = new Date();
        const proximaData = new Date(hoje);
        proximaData.setMonth(proximaData.getMonth() + 3);

        document.getElementById('texto').value = montarCertificado(
          formatarData(hoje),
          formatarData(proximaData)
        );
      });

      async function registrarHash() {
        const text = document.getElementById('texto').value;
        const resultado = document.getElementById('resultado');

        if (!text.trim()) {
          alert('Digite um texto antes de registrar');
          return;
        }

        const texto = text.trim();

        resultado.textContent = 'Enviando...';

        try {
          const response = await fetch('/register', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ relatorio: texto }),
          });

          const data = await response.json();
          resultado.textContent = JSON.stringify(data, null, 2);
        } catch (error) {
          resultado.textContent = `Erro: ${error.message}`;
        }
      }
    </script>
  </body>
</html>
